        score:
          type: number
          nullable: true
        matched_group_id:
          type: string
          nullable: true
        availability_date:
          type: string
          format: date
          nullable: true
        availability_slot:
          type: string
          nullable: true
        vibe:
          type: string
          nullable: true
        age_min:
          type: integer
          nullable: true
        age_max:
          type: integer
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        radius_km:
          type: number
          nullable: true
        voice_duration_sec:
          type: integer
          nullable: true
        voice_intro_id:
          type: string
          nullable: true
        voice_storage_url:
          type: string
          nullable: true
        voice_mime_type:
          type: string
          nullable: true
        voice_size_bytes:
          type: integer
          nullable: true
        voice_recorded_at:
          type: string
          format: date-time
