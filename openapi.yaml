          type: string
          nullable: true
        mime_type:
          type: string
        size_bytes:
          type: integer
          nullable: true
        recorded_at:
          type: string
          format: date-time
          nullable: true

    VoiceIntroResponse:
      type: object
      required: [success, data]
      properties:
