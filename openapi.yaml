        availability_date:
          type: string
          format: date
          nullable: true
        vibe:
          type: string
        age_min:
          type: integer
        age_max:
          type: integer
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        radius_km:
          type: number
        voice_duration_sec:
          type: integer
          minimum: 15
        voice_intro_id:
          type: string
          nullable: true
        voice_storage_url:
          type: string
        voice_mime_type:
          type: string
          nullable: true
        voice_size_bytes:
          type: integer
          nullable: true
        voice_recorded_at:
          type: string
          format: date-time
          nullable: true

    MatchRequestResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            request:
              $ref: '#/components/schemas/MatchRequest'
