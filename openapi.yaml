              type: object
              properties:
                voice_intro_id:
                  type: string
                storage_url:
                  type: string
                duration_sec:
                  type: integer
                mime_type:
                  type: string
                size_bytes:
                  type: integer
                  nullable: true
                recorded_at:
                  type: string
                  format: date-time

    MatchRequestBody:
